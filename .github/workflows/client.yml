name: Client

on:
  push:
    paths:
      - "client/atlas-foods-client/**"
      - ".github/workflows/client.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/atlas-foods-client/**"
      - ".github/workflows/client.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/atlas-foods-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/atlas-foods-client/package-lock.json
      - run: npm ci
      - run: npm run build
