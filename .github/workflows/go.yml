name: Go CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/go.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: ./backend
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ./backend
        run: go vet ./...

      - name: Test
        working-directory: ./backend
        run: go test ./...

      - name: Build
        working-directory: ./backend
        run: go build -o simapi ./cmd/simapi/

      - name: Upload Linux simapi
        uses: actions/upload-artifact@v4
        with:
          name: simapi-linux-amd64
          path: backend/simapi
          if-no-files-found: error
