openapi: "3.0.3"
info:
  title: NewHaven API
  version: "0.1.0"
  description: Backend API for NewHaven browser-based economy simulation game

servers:
  - url: http://localhost:8088

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: readyz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v2/players/me/companies/:
    get:
      tags: [Companies]
      summary: List my companies
      operationId: listMyCompanies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Company list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCompaniesResponse'
        "401":
          description: Unauthorized

  /api/v2/companies/me/warehouse/:
    get:
      tags: [Warehouse]
      summary: Get my company warehouse
      operationId: getMyWarehouse
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Warehouse data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyWarehouseData'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v3/companies/me/buildings/:
    get:
      tags: [Buildings]
      operationId: listMyBuildings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Building list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingListResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/production/jobs/:
    get:
      tags: [Production]
      summary: List production jobs for my company
      operationId: listProductionJobs
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Production job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionJobListResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/production/start/:
    post:
      tags: [Production]
      summary: Start a production job
      operationId: startProduction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProductionRequest'
      responses:
        "200":
          description: Production job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartProductionResponse'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/production/claim/{jobId}/:
    post:
      tags: [Production]
      summary: Claim produced resources from a production job
      operationId: claimProduction
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Production claimed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimProductionResponse'
        "400":
          description: Nothing claimable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/production/claimable/:
    get:
      tags: [Production]
      summary: List claimable production jobs
      operationId: listClaimableJobs
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Claimable job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimableJobListResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/register:
    post:
      tags: [Auth]
      summary: Register
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    EmptyResponse:
      type: object
      properties: {}

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 6

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        player_id:
          type: integer
        company_id:
          type: integer
        username:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 6
        name:
          type: string
        gender:
          type: string
        email:
          type: string

    ErrorResponse:
      type: object
      properties:
        data:
          nullable: true
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    # --- Company ---

    CompanyResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        money:
          type: number
          format: float
        level:
          type: integer
        xp:
          type: integer
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/Building"
        inventory:
          type: object
          additionalProperties:
            type: integer

    MyCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanySummary'

    CompanySummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        money:
          type: number
          format: float
        level:
          type: integer

    Building:
      type: object
      properties:
        id:
          type: string
        building_id:
          type: integer
        kind:
          type: integer
        name:
          type: string
        level:
          type: integer
        map_id:
          type: string
        slot_id:
          type: string
        x:
          type: integer
        y:
          type: integer
        robot_count:
          type: integer


    BuildingDTO:
      type: object
      properties:
        id:
          type: string
        building_id:
          type: integer
        name:
          type: string
        level:
          type: integer
        map_id:
          type: string
        slot_id:
          type: string
        x:
          type: integer
        y:
          type: integer
        robot_count:
          type: integer
    BuildingListResponse:
      type: object
      properties:
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/BuildingDTO'
    # --- Warehouse ---

    WarehouseItem:
      type: object
      properties:
        resource_id:
          type: integer
        resource_name:
          type: string
        quality:
          type: integer
        amount:
          type: integer

    GetMyWarehouseData:
      type: object
      properties:
        company_id:
          type: integer
        capacity:
          type: integer
        used_capacity:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseItem'


    # --- Market ---

    MarketTicker:
      type: object
      properties:
        resource_id:
          type: integer
        last_price:
          type: number
        volume_24h:
          type: number
        high_24h:
          type: number
        low_24h:
          type: number
        price_change_24h:
          type: number
        updated_at:
          type: string
          format: date-time

    MarketDepth:
      type: object
      properties:
        resource_id:
          type: integer
        bids:
          type: array
          items:
            $ref: "#/components/schemas/DepthLevel"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/DepthLevel"

    DepthLevel:
      type: object
      properties:
        price:
          type: number
        quantity:
          type: integer
        orders:
          type: integer

    CreateOrderRequest:
      type: object
      required: [resource_id, is_buy, price, quantity]
      properties:
        resource_id:
          type: integer
          minimum: 1
        is_buy:
          type: boolean
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        quantity:
          type: integer
          minimum: 1
    # --- Production ---

    ProductionJob:
      type: object
      properties:
        id:
          type: string
        company_id:
          type: integer
        building_id:
          type: string
        resource_id:
          type: integer
        quantity:
          type: integer
        target_quantity:
          type: integer
        started_at:
          type: string
          format: date-time
        duration_seconds:
          type: number
        status:
          type: string
          enum: [running, ready, claimed]

    StartProductionRequest:
      type: object
      required: [building_id, resource_id, quantity]
      properties:
        building_id:
          type: string
        resource_id:
          type: integer
        quantity:
          type: integer
          minimum: 1

    ProductionJobDTO:
      type: object
      properties:
        id:
          type: string
        resource_id:
          type: integer
        quantity:
          type: integer
        target_quantity:
          type: integer
        started_at:
          type: string
          format: date-time
        duration_seconds:
          type: number
        claimed_amount:
          type: integer
        claimable_amount:
          type: integer
        status:
          type: string
          enum: [running, ready, claimed]
    ProductionJobListData:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ProductionJobDTO'
    ProductionJobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ProductionJobDTO'

    BuildingProductionStatus:
      type: object
      properties:
        id:
          type: string
        busy:
          type: boolean
        job_id:
          type: string
    StartProductionResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/ProductionJobDTO'
        building:
          $ref: '#/components/schemas/BuildingProductionStatus'

    ClaimProductionResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [running, ready, claimed]
        output:
          type: object
          additionalProperties:
            type: integer
        claimed_amount:
          type: integer
        remaining:
          type: integer
        xp:
          type: integer
        level:
          type: integer
        market_unlocked:
          type: boolean

    ClaimableJobDTO:
      type: object
      properties:
        job_id:
          type: string
        building_id:
          type: string
        resource_id:
          type: integer
        total_amount:
          type: integer
        claimed_amount:
          type: integer
        claimable_amount:
          type: integer

    ClaimableJobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ClaimableJobDTO'

    # --- Finance ---

    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        kind:
          type: string
        amount:
          type: number
        direction:
          type: string
          enum: [in, out]
        balance_after:
          type: number
        created_at:
          type: string
          format: date-time

    Bond:
      type: object
      properties:
        id:
          type: string
        issuer_company_id:
          type: integer
        face_value:
          type: number
        interest_rate:
          type: number
        total_quantity:
          type: integer
        issued_quantity:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
